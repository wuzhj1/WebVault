<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#15161b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WebVault" />
    <meta
      name="description"
      content="本地优先的 Markdown 双链笔记,正文存在本机,通过你自己的 Gitee 仓库同步。"
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>WebVault</title>
    <script>
      // 首帧之前把主题写到 <html>,否则浅色主题启动时会先闪一下深色。
      try {
        var saved = JSON.parse(localStorage.getItem('webvault:appearance') || '{}')
        var safe = function (v) {
          return typeof v === 'string' && /^[a-z0-9-]{1,24}$/.test(v)
        }
        var root = document.documentElement
        if (safe(saved.theme)) root.setAttribute('data-theme', saved.theme)
        if (safe(saved.mode)) root.setAttribute('data-mode', saved.mode)
        if (safe(saved.accent)) root.setAttribute('data-accent', saved.accent)
      } catch (e) {
        /* 存储不可用时用样式表里的默认主题 */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
