# push 到 main 后构建并部署 GitHub Pages。
# 项目页托管在 https://wuzhj1.github.io/WebVault/ 这个子路径下,
# vite.config.ts 读 VAULT_BASE 得出 base=/WebVault/(资源路径、PWA scope 同步生效)。
# 产物走 actions 制品上传,不往版本库提交 dist。
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只允许一次部署,后一次不打断进行中的那次。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VAULT_BASE: /WebVault/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
